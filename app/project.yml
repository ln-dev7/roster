# Xcode project definition, generated by XcodeGen.
# After changing this file (or adding/removing a source file), run:
#   cd app && xcodegen
# The resulting .xcodeproj and Info.plist are not versioned — this file is the
# source of truth for both. (Same convention as DockKeep.)

name: Roster

options:
  bundleIdPrefix: com.lndev
  deploymentTarget:
    macOS: "14.0"          # minimum target; developed and tested on macOS 26
  createIntermediateGroups: true

  # English is the development language and therefore the fallback. Adding a
  # language later means adding a .lproj folder under Resources, nothing more.
  developmentLanguage: en

# ── Sparkle ──────────────────────────────────────────────────────────────────
# Deliberately absent for now. The decision from the brief is "wired but
# silent": the package, the UpdaterModel and the (disabled) update check all
# arrive together in increment 5 with the release pipeline, so the app never
# carries a half-dead update path in the meantime. This prototype is the
# kill-gate — if the walk isn't right, none of this ships anyway.

# A shared scheme, so a future scripts/build.sh can drive xcodebuild, exactly
# like DockKeep's. A tests target joins in increment 2 with the state machine.
schemes:
  Roster:
    build:
      targets:
        Roster: all
    run:
      config: Debug
    archive:
      config: Release

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: JDWTCZR377

targets:
  Roster:
    type: application
    platform: macOS
    sources:
      - Roster

    # Info.plist written out by XcodeGen (not GENERATE_INFOPLIST_FILE), so that
    # the Sparkle keys of increment 5 can be added here without surprises.
    info:
      path: SupportingFiles/Info.plist
      properties:
        CFBundleName: Roster
        CFBundleDisplayName: Roster
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Ange Leonel Ngoya Jipgang"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleIconName: AppIcon

    settings:
      base:
        PRODUCT_NAME: Roster
        PRODUCT_BUNDLE_IDENTIFIER: com.lndev.roster
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1

        # Automatic signing with the development certificate for local builds.
        # Release signing (Developer ID + notarization) will be handled by
        # scripts/build.sh in increment 5, never by Xcode.
        CODE_SIGN_STYLE: Automatic

        # Hardened runtime from day one: required for notarization later, so
        # we develop under the same conditions. No sandbox: Roster must read
        # ~/.claude and write a hook into ~/.claude/settings.json (increment 3),
        # which a sandboxed app cannot do — same trade-off as DockKeep, and the
        # reason the Mac App Store is not a target.
        ENABLE_HARDENED_RUNTIME: YES

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
