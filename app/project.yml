# Xcode project definition, generated by XcodeGen.
# After changing this file (or adding/removing a source file), run:
#   cd app && xcodegen
# The resulting .xcodeproj and Info.plist are not versioned — this file is the
# source of truth for both. (Same convention as DockKeep.)

name: Roster

options:
  bundleIdPrefix: com.lndev
  deploymentTarget:
    macOS: "14.0"          # minimum target; developed and tested on macOS 26
  createIntermediateGroups: true

  # English is the development language and therefore the fallback. Adding a
  # language later means adding a .lproj folder under Resources, nothing more.
  developmentLanguage: en

packages:
  # Sparkle is the standard updater for apps distributed outside the App
  # Store. Pinned to the 2.9 line — same reasoning as DockKeep: security
  # fixes included, no surprise API break on a routine resolve.
  #
  # Wired but SILENT: Info.plist ships without SUFeedURL, and UpdaterModel
  # refuses to start the updater while that key is absent. When
  # roster.lndev.me serves the appcast, adding SUFeedURL + SUPublicEDKey
  # below turns updates on — no code change needed.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.2"

# A shared scheme, so a future scripts/build.sh can drive xcodebuild, exactly
# like DockKeep's. Run the tests with ⌘U (or xcodebuild test).
schemes:
  Roster:
    build:
      targets:
        Roster: all
        # Built for the test action only, so a future `xcodebuild archive`
        # never compiles or signs the test bundle.
        RosterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RosterTests
    archive:
      config: Release

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: JDWTCZR377

targets:
  Roster:
    type: application
    platform: macOS
    sources:
      - Roster
    dependencies:
      - package: Sparkle

    # Info.plist written out by XcodeGen (not GENERATE_INFOPLIST_FILE):
    # Sparkle's keys are ones Xcode's generator doesn't reliably carry.
    info:
      path: SupportingFiles/Info.plist
      properties:
        CFBundleName: Roster
        CFBundleDisplayName: Roster
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Ange Leonel Ngoya Jipgang"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleIconName: AppIcon

        # ── Sparkle (dormant) ────────────────────────────────────────────
        # SUFeedURL and SUPublicEDKey are deliberately absent: without a
        # feed the updater never starts (see UpdaterModel). At site launch,
        # add:
        #   SUFeedURL: "https://roster.lndev.me/appcast.xml"
        #   SUPublicEDKey: "<output of Sparkle's generate_keys>"
        # Off, and stated plainly: no hardware profile ever leaves the Mac.
        SUEnableSystemProfiling: false
        # Once a day is plenty, once checking exists at all.
        SUScheduledCheckInterval: 86400

    settings:
      base:
        PRODUCT_NAME: Roster
        PRODUCT_BUNDLE_IDENTIFIER: com.lndev.roster
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1

        # Automatic signing with the development certificate for local builds.
        # Release signing (Developer ID + notarization) will be handled by
        # scripts/build.sh in increment 5, never by Xcode.
        CODE_SIGN_STYLE: Automatic

        # Hardened runtime from day one: required for notarization later, so
        # we develop under the same conditions. No sandbox: Roster must read
        # ~/.claude and write a hook into ~/.claude/settings.json (increment 3),
        # which a sandboxed app cannot do — same trade-off as DockKeep, and the
        # reason the Mac App Store is not a target.
        ENABLE_HARDENED_RUNTIME: YES

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Unit tests for the state machine and the room geometry.
  #
  # The logic under test is compiled straight into this bundle rather than
  # imported from the app: a hosted test bundle would have to launch Roster
  # (and Roster on launch reads ~/.claude — exactly what tests must stay
  # away from). Compiling a handful of files twice is a small price for a
  # suite that cannot touch anything real. Same reasoning as DockKeep's
  # test target.
  RosterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RosterTests
      - path: Roster/Core/Office.swift
      - path: Roster/Core/Office+Events.swift
      - path: Roster/Core/ClaudeEvent.swift
      - path: Roster/Core/RoomPlan.swift
      - path: Roster/Data/HookInstaller.swift
      - path: Roster/Data/WorkstationStore.swift
      - path: Roster/Data/ClaudeConfigRoots.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lndev.roster.tests

        # Let Xcode write the Info.plist for this one; a test bundle needs
        # no key Xcode does not already know about.
        GENERATE_INFOPLIST_FILE: YES

        # Signed to run locally, which is all a bundle that never leaves
        # this Mac needs.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
